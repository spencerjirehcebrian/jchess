server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files the build already prepared. gzip on covers whatever
    # has no prepared twin.
    gzip_static on;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml font/woff2;

    # jchess chooses its Stockfish build from self.crossOriginIsolated: isolated
    # gets the multithreaded engine, anything else falls back to the single
    # threaded one. These two headers are the whole of what makes it isolated,
    # and vite.config.ts only sets them for dev and preview.
    #
    # An add_header anywhere inside a location block discards every header
    # inherited from here — so each location below that sets its own
    # Cache-Control has to repeat them. Forgetting raises no error and breaks
    # nothing visibly. It just quietly gives every visitor the slower engine.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options       "nosniff"      always;

    # Vite fingerprints these, so a URL here never changes meaning.
    location ~* ^/(assets|fonts)/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options       "nosniff"      always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The engine filenames carry a version rather than a hash, so a Stockfish
    # bump reuses these paths. Cached long, but not as immutable.
    location /engine/ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options       "nosniff"      always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The one file that must never be stale: it names every hashed asset.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options       "nosniff"      always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
